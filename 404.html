<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>الصفحة غير موجودة · TheTeam</title>
<style>
@font-face{font-family:'Almarai';src:url(/gaserc-proposal/designs/_shots/Almarai-Regular.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Almarai';src:url(/gaserc-proposal/designs/_shots/Almarai-ExtraBold.ttf) format('truetype');font-weight:700 900;font-display:swap}
:root{--ink:#1b1b22;--body:#3a3c44;--muted:#8a8c95;--line:#e7e5df;--bg:#fbfaf7;--blue:#0a3a9e;--mag:#8e1a7d}
*{box-sizing:border-box;margin:0;padding:0}
html{font-family:'Almarai',system-ui,sans-serif;color:var(--body);background:var(--bg);-webkit-font-smoothing:antialiased}
body{background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
main{max-width:560px}
h1{font-size:clamp(26px,4vw,36px);font-weight:800;color:var(--ink);line-height:1.25;margin-bottom:12px}
p{font-size:16px;line-height:1.75}
a.btn{display:inline-flex;margin-top:22px;font-weight:800;font-size:15px;color:#fff;background:var(--ink);padding:11px 20px;border-radius:12px;text-decoration:none;transition:background-color .2s ease}
a.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
@media (hover:hover) and (pointer:fine){a.btn:hover{background:var(--mag)}}
small{display:block;margin-top:28px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>إن وصلتم من رابط أحد اتجاهات التصميم السابقة: اختار المركز اتجاه «المكتبة الرسمية»، فأُزيلت نماذج الاتجاهات الأخرى.</p>
  <a class="btn" href="/gaserc-proposal/designs/">افتح الاتجاه المختار ←</a>
  <small>نماذج تصميم مقترحة من TheTeam، وليست موقع المركز الرسمي.</small>
</main>
</body>
</html>
